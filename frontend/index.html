<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast-Tix - Temukan Event Seru</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .navbar-brand { font-weight: 800; letter-spacing: -0.5px; }
        .hero-section { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 60px 0; border-radius: 0 0 32px 32px; }
        .event-card { border: none; border-radius: 20px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; background: #fff; }
        .event-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .event-banner { height: 200px; background-size: cover; background-position: center; position: relative; }
        .badge-category { position: absolute; top: 15px; left: 15px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); font-size: 0.75rem; color: #fff; padding: 6px 12px; border-radius: 100px; }
        .btn-buy { background-color: #0f172a; color: #fff; border-radius: 12px; font-weight: 600; padding: 10px; width: 100%; border: none; transition: 0.2s; }
        .btn-buy:hover { background-color: #2563eb; color: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container">
        <a class="navbar-brand fs-4" href="#">FAST<span class="text-warning">.</span>TIX</a>
    </div>
</nav>

<div class="hero-section text-center text-white mb-5">
    <div class="container py-3">
        <h1 class="fw-800 display-5 mb-2">Jelajahi Event Terpopuler 2026</h1>
        <p class="text-white-50">Beli tiket aman, cepat, dan instan tanpa antre</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row g-4" id="eventContainer">
        <div class="col-md-6 col-lg-4">
            <div class="card event-card h-100 shadow-sm">
                <div class="event-banner" style="background-image: url('https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&fit=crop&w=800&q=80');">
                    <span class="badge-category">Konser</span>
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <h5 class="fw-bold mb-2">Konser Musik Pop Internasional</h5>
                    <p class="text-muted small mb-4">📍 Stadion Utama GBK, Jakarta</p>
                    <div class="mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-muted small">Mulai dari</span>
                            <span class="fw-bold text-dark fs-5">Rp 500.000</span>
                        </div>
                        <button class="btn-buy" onclick="pilihEvent('Konser Musik Pop Internasional', 500000)">Beli Tiket</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card event-card h-100 shadow-sm">
                <div class="event-banner" style="background-image: url('https://images.unsplash.com/photo-1515187029135-18ee286d815b?auto=format&fit=crop&w=800&q=80');">
                    <span class="badge-category">Edukasi</span>
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <h5 class="fw-bold mb-2">Workshop Coding Node.js 2026</h5>
                    <p class="text-muted small mb-4">📍 Menara Tekno, Jakarta Pusat</p>
                    <div class="mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-muted small">Mulai dari</span>
                            <span class="fw-bold text-dark fs-5">Rp 150.000</span>
                        </div>
                        <button class="btn-buy" onclick="pilihEvent('Workshop Coding Node.js 2026', 150000)">Beli Tiket</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function pilihEvent(nama, harga) {
        // Simpan data event terpilih ke localStorage agar bisa dibaca di halaman checkout
        localStorage.setItem('selectedEventName', nama);
        localStorage.setItem('selectedEventPrice', harga);
        window.location.href = 'checkout.html';
    }
</script>
</body>
</html>
