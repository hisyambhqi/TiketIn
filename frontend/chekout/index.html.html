<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Tiket - Fast-Tix</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .ticket-card { border: none; border-radius: 24px; background: #fff; }
        .brand-header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 1.5rem; border-radius: 24px 24px 0 0; }
        .form-label { font-weight: 600; font-size: 0.875rem; color: #334155; }
        .form-control { border-radius: 12px; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; }
        
        .ticket-tier-box { border: 2px solid #f1f5f9; border-radius: 16px; padding: 1.25rem; background: #fff; transition: 0.2s; }
        .ticket-tier-box.selected { border-color: #0f172a; background-color: #fafafa; }
        .counter-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff; font-weight: bold; transition: 0.2s; }
        .counter-btn:hover { background: #0f172a; color: #fff; border-color: #0f172a; }
        
        .summary-box { background-color: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 16px; padding: 1.25rem; }
        .btn-checkout { background-color: #0f172a; color: #fff; border-radius: 14px; padding: 1rem; font-weight: 700; border: none; width: 100%; }
        .btn-checkout:hover { background-color: #1e293b; }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <a href="index.html" class="text-decoration-none text-muted small d-inline-flex align-items-center mb-3">← Kembali ke Beranda</a>
            
            <div class="card ticket-card shadow-lg">
                <div class="brand-header text-white text-center">
                    <h4 class="fw-800 m-0">FAST<span class="text-warning">.</span>TIX</h4>
                </div>

                <div class="card-body p-4 p-md-5">
                    <h5 class="fw-bold mb-2 text-secondary-emphasis" id="txtNamaEvent">Memuat Event...</h5>
                    <p class="text-muted small mb-4">Silakan lengkapi data dan pilih jumlah tiket Anda</p>

                    <form id="formTiket">
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap Pemesan</label>
                            <input type="text" id="nama" class="form-control" required placeholder="Sesuai KTP / ID Card">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Alamat Email</label>
                            <input type="email" id="email" class="form-control" required placeholder="budi@example.com">
                        </div>

                        <h6 class="fw-bold mb-3">Pilih Kategori Tiket</h6>
                        
                        <div class="ticket-tier-box mb-4 d-flex justify-content-between align-items-center" id="ticketBox">
                            <div>
                                <div class="fw-bold text-dark" id="txtTierName">Kategori Reguler</div>
                                <div class="text-muted small fw-semibold" id="txtTierPrice">Rp 0</div>
                            </div>
                            
                            <div>
                                <button type="button" class="btn btn-outline-dark fw-bold px-4 py-2" id="btnPilihAwal" style="border-radius: 12px;" onclick="aktifkanCounter()">
                                    + Tambah
                                </button>

                                <div class="d-none align-items-center gap-3" id="panelCounter">
                                    <button type="button" class="counter-btn" onclick="ubahJumlah(-1)">-</button>
                                    <span class="fw-bold fs-5 text-dark" id="ticketCount" style="min-width: 20px; text-align: center;">1</span>
                                    <button type="button" class="counter-btn" onclick="ubahJumlah(1)">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="summary-box mb-4 d-none" id="boxSummary">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="text-muted small">Subtotal (<span id="summaryQty">1</span> tiket)</span>
                                <span class="fw-semibold" id="summarySubtotal">Rp 0</span>
                            </div>
                            <div class="border-top pt-3 d-flex justify-content-between align-items-center">
                                <span class="fw-bold">Total Pembayaran</span>
                                <span class="fw-bold fs-4 text-dark" id="summaryTotal">Rp 0</span>
                            </div>
                        </div>

                        <button type="submit" id="btnBayar" class="btn btn-checkout btn-lg shadow-sm" disabled>Pilih tiket terlebih dahulu</button>
                    </form>

                    <div id="loading" class="text-center mt-4 d-none">
                        <div class="spinner-border text-dark mb-2" role="status"></div>
                        <p class="mb-0 fw-semibold">Memproses pesanan aman Anda...</p>
                    </div>
                    <div id="suksesAlert" class="alert alert-success mt-4 d-none" role="alert">
                        🎉 <strong>Pembayaran Berhasil!</strong> E-Ticket & QR Code unik telah dikirim ke email Anda.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const eventName = localStorage.getItem('selectedEventName') || 'Event Tidak Diketahui';
    const eventPrice = parseInt(localStorage.getItem('selectedEventPrice')) || 0;
    
    let jumlahTiket = 0; 
    let isTiketDipilih = false;

    document.getElementById('txtNamaEvent').innerText = eventName;
    document.getElementById('txtTierName').innerText = `Tiket Masuk: ${eventName}`;
    document.getElementById('txtTierPrice').innerText = `Rp ${eventPrice.toLocaleString('id-ID')}`;

    function aktifkanCounter() {
        jumlahTiket = 1; 
        isTiketDipilih = true;

        document.getElementById('btnPilihAwal').classList.add('d-none');
        document.getElementById('panelCounter').classList.remove('d-none');
        document.getElementById('panelCounter').classList.add('d-flex');
        document.getElementById('boxSummary').classList.remove('d-none');
        document.getElementById('ticketBox').classList.add('selected');

        const btnBayar = document.getElementById('btnBayar');
        btnBayar.disabled = false;
        btnBayar.innerText = "Bayar Sekarang";

        updateSummary();
    }

    function updateSummary() {
        if (!isTiketDipilih) return;
        const total = eventPrice * jumlahTiket;
        document.getElementById('ticketCount').innerText = jumlahTiket;
        document.getElementById('summaryQty').innerText = jumlahTiket;
        document.getElementById('summarySubtotal').innerText = 'Rp ' + total.toLocaleString('id-ID');
        document.getElementById('summaryTotal').innerText = 'Rp ' + total.toLocaleString('id-ID');
    }

    function ubahJumlah(nilai) {
        jumlahTiket += nilai;

        if (jumlahTiket < 1) {
            jumlahTiket = 0;
            isTiketDipilih = false;

            document.getElementById('btnPilihAwal').classList.remove('d-none');
            document.getElementById('panelCounter').classList.add('d-none');
            document.getElementById('panelCounter').classList.remove('d-flex');
            document.getElementById('boxSummary').classList.add('d-none');
            document.getElementById('ticketBox').classList.remove('selected');

            const btnBayar = document.getElementById('btnBayar');
            btnBayar.disabled = true;
            btnBayar.innerText = "Pilih tiket terlebih dahulu";
            return;
        }

        if (jumlahTiket > 5) jumlahTiket = 5; 
        updateSummary();
    }

    document.getElementById('formTiket').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (jumlahTiket < 1) {
            alert('Silakan tambah jumlah tiket sebelum melakukan pembayaran.');
            return;
        }

        const nama = document.getElementById('nama').value;
        const email = document.getElementById('email').value;
        const btn = document.getElementById('btnBayar');
        const loading = document.getElementById('loading');
        const suksesAlert = document.getElementById('suksesAlert');
        const form = document.getElementById('formTiket');

        form.classList.add('d-none');
        loading.classList.remove('d-none');

        try {
            // CATATAN: Ubah URL localhost ini menjadi URL domain backend asli Anda setelah di-hosting!
            const respon = await fetch('http://localhost:3000/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama, email, eventName, ticketCount: jumlahTiket })
            });
            const hasil = await respon.json();
            if (hasil.success) {
                suksesAlert.classList.remove('d-none');
            } else {
                alert('Gagal: ' + hasil.message);
                form.classList.remove('d-none');
            }
        } catch (error) {
            alert('Gagal menyambung ke server backend.');
            form.classList.remove('d-none');
        } finally {
            loading.classList.add('d-none');
        }
    });
</script>
</body>
</html>
